name: opensic
description: Open-source, ad-free hybrid Android music player.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  on_audio_query: ^2.9.0
  shared_preferences: ^2.3.5
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
