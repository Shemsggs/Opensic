name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold if missing
        run: flutter create --platforms=android --org org.opensic --project-name opensic .
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build development release APK
        env:
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: flutter build apk --release --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensic-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
