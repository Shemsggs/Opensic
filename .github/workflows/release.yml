name: Android Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify tag matches package version
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Create Android scaffold if missing
        run: flutter create --platforms=android --org org.opensic --project-name opensic .
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build development release APK
        env:
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: flutter build apk --release --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"
      - name: Publish APK pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: Opensic ${{ github.ref_name }}
          body: |
            Development APK for testing. This is signed with the Android debug key, not a production signing key, and has not been device-tested.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
